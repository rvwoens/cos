name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  tests:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '7.4', laravel: '8' }
          - { php: '8.1', laravel: '9' }
          - { php: '8.1', laravel: '10' }
          - { php: '8.2', laravel: '11' }
          - { php: '8.3', laravel: '12' }
          - { php: '8.4', laravel: '13' }
          - { php: '8.5', laravel: '13' }

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        coverage: none

    # composer.lock pins a single Laravel version, so resolve fresh for each combination.
    # The lint tools only run in the lint job (and need a newer PHP), so leave them out here.
    # Laravel 8-11 all have open security advisories by now; allow them so those versions can still be tested.
    - name: Install dependencies for Laravel ${{ matrix.laravel }}
      run: |
        composer remove --dev friendsofphp/php-cs-fixer phpmd/phpmd --no-update --no-interaction
        composer require --dev "laravel/framework:^${{ matrix.laravel }}.0" --no-update --no-interaction
        composer config policy.advisories.block false
        composer config audit.block-insecure false
        composer update --prefer-dist --no-interaction --no-progress

    - name: Run test suite
      run: composer run-script test

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        coverage: none

    - name: Validate composer.json and composer.lock
      run: composer validate

    - name: Install dependencies
      run: composer install --prefer-dist --no-interaction --no-progress

    - name: Run phpmd code smell
      run: composer run-script smell

    - name: Run php-cs-fixer
      run: composer run-script fix

    - uses: stefanzweifel/git-auto-commit-action@v5
      with:
          commit_message: Apply php-cs-fixer changes
